<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.webmanifest">
  <title>DOCX Reader · Trình đọc tiếng Việt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">DOCX READER</div>
      <h1>DOCX Reader · Tiếng Việt</h1>
      <p id="status">Đang chuẩn bị nội dung…</p>
    </div>
    <div class="actions">
      <button id="voiceButton" class="secondary">Kiểm tra voice</button>
      <button id="exportAudioButton" class="secondary">Xuất audio chương này</button>
      <button id="exportAllAudioButton" class="secondary">Xuất tất cả audio</button>
      <button id="darkButton" class="secondary" aria-label="Đổi nền tối">☾</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="side-title">Mục lục <span id="chapterCount"></span></div>
      <label class="chapter-search-label" for="chapterSearch">Tìm phần</label>
      <input id="chapterSearch" class="chapter-search" type="search" placeholder="Nhập tên phần…" autocomplete="off" spellcheck="false">
      <nav id="chapterList" aria-label="Danh sách chương"></nav>
      <div id="chapterEmpty" class="chapter-empty" hidden>Không có phần phù hợp.</div>
      <div class="settings">
        <div class="side-title">Tùy chỉnh</div>
        <label>Nền<select id="background"><option value="night">Đen</option><option value="paper">Giấy ấm</option><option value="white">Trắng</option></select></label>
        <label>Font<select id="font"><option value="Montserrat Local">Montserrat (DOCX)</option><option value="Quattrocento Local">Quattrocento Sans (DOCX)</option><option value="Arial">Arial</option><option value="Arial Unicode MS">Arial Unicode MS</option><option value="Cambria">Cambria</option><option value="Georgia">Georgia</option><option value="Liberation Serif">Liberation Serif</option></select></label>
        <label>Giọng<select id="voice"><option value="">Đang tải voice…</option></select></label>
        <small id="voiceHint" class="voice-hint" hidden></small>
        <button id="voiceTestButton" class="voice-test" type="button">▶ Thử giọng đang chọn</button>
        <label>Âm lượng <output id="volumeValue">100%</output><input id="volume" type="range" min="0" max="1" step="0.05" value="1"></label>
        <label>Độ cao giọng <output id="pitchValue">1.00</output><input id="pitch" type="range" min="0.5" max="1.5" step="0.05" value="1"></label>
        <label class="check-label"><input id="autoScroll" type="checkbox" checked> Tự động cuộn theo đoạn đang đọc</label>
        <label class="check-label"><input id="autoNext" type="checkbox"> Tự sang phần kế khi đọc xong</label>
        <button id="resetProgress" class="reset-progress" type="button">↺ Xóa vị trí đã lưu</button>
        <label>Cỡ chữ <output id="sizeValue">20px</output><input id="size" type="range" min="16" max="30" value="20"></label>
        <label>Độ rộng <output id="widthValue">920px</output><input id="width" type="range" min="680" max="1120" step="20" value="920"></label>
        <div class="align-row"><span>Căn lề</span><button data-align="left">Trái</button><button data-align="justify">Đều</button></div>
      </div>
    </aside>

    <section class="reader" aria-live="polite">
      <div class="reader-head">
        <div>
          <div id="chapterNumber" class="eyebrow"></div>
          <h2 id="chapterTitle">Chọn một chương</h2>
        </div>
        <div class="chapter-actions">
          <button id="prevButton" class="secondary">← Trước</button>
          <button id="nextButton" class="secondary">Sau →</button>
        </div>
      </div>
      <div class="chapter-progress" aria-label="Tiến độ chương"><span id="chapterProgress"></span></div>
      <div id="content" class="content"><p>Chọn chương bên trái để bắt đầu đọc.</p></div>
      <footer class="player">
        <div id="nowReading" class="now-reading">Chưa bắt đầu đọc</div>
        <button id="playButton" class="primary">▶ Đọc chương</button>
        <button id="pauseButton" class="secondary">Ⅱ Tạm dừng</button>
        <button id="resumeButton" class="secondary">▶ Tiếp tục</button>
        <button id="stopButton" class="secondary">■ Dừng</button>
        <label>Tốc độ <input id="rate" type="range" min="0.6" max="2" step="0.05" value="1"><output id="rateValue">1.00×</output></label>
      </footer>
    </section>
  </main>
  <script src="reader-config.js"></script>
  <script src="chapters.js"></script>
  <script src="reader.js?v=tts-fix-14"></script>
</body>
</html>
